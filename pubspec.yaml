name: nagarik_plus
description: "Nagarik+ - Secure Documents. Smarter Citizen Services."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1

  # Storage & Security
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.3.0

  # File & Documents  (v11+ uses v2 embedding only)
  file_picker: ^8.0.7
  path_provider: ^2.1.2
  permission_handler: ^12.0.0

  # Network
  http: ^1.2.0
  dio: ^5.4.0
  connectivity_plus: ^6.1.4

  # Local Storage & Caching
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.2.3
  uuid: ^4.4.0

  # Image
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  photo_manager: ^3.6.3

  # Document Scanner
  camera: ^0.11.0+2
  image: ^4.1.7
  pdf: ^3.11.1
  path: ^1.9.0
  printing: ^5.12.0
  flutter_image_compress: ^2.2.0
  share_plus: ^12.0.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  installed_apps: ^1.4.0
  device_info_plus: ^10.1.0
  google_mlkit_text_recognition: ^0.13.0
  cunning_document_scanner: ^2.0.1

  # NagarikShare — offline peer-to-peer file transfer (Wi-Fi Direct + TCP sockets)
  crypto: ^3.0.3
  flutter_contacts: ^1.1.9+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app-icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app-icon.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/Banner/
    - assets/bgimages/
